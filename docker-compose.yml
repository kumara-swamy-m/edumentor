name: edumentor

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: dev
  JAVA_TOOL_OPTIONS: -Xmx300m
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: root
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  EUREKA_ENABLED: "true"
  EUREKA_URL: http://service-registry:8761/eureka
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  mysql:
    image: mysql:8.4
    container_name: edumentor-mysql-stack
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: edumentor-pgvector-stack
    environment:
      POSTGRES_DB: edumentor_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edumentor_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: edumentor-kafka-stack
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  service-registry:
    build: ./services/service-registry
    container_name: edumentor-service-registry
    environment:
      JAVA_TOOL_OPTIONS: -Xmx200m
      EUREKA_HOSTNAME: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  auth-service:
    build: ./services/auth-service
    container_name: edumentor-auth-service
    environment:
      <<: *java-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@edumentor.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      mysql: {condition: service_healthy}
      service-registry: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  mentor-service:
    build: ./services/mentor-service
    container_name: edumentor-mentor-service
    environment:
      <<: *java-env
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  booking-service:
    build: ./services/booking-service
    container_name: edumentor-booking-service
    environment:
      <<: *java-env
      MENTOR_SERVICE_URL: http://mentor-service:8082
      HOLD_DURATION: ${HOLD_DURATION:-PT10M}
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  payment-service:
    build: ./services/payment-service
    container_name: edumentor-payment-service
    environment:
      <<: *java-env
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  notification-service:
    build: ./services/notification-service
    container_name: edumentor-notification-service
    environment:
      <<: *java-env
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  review-service:
    build: ./services/review-service
    container_name: edumentor-review-service
    environment:
      <<: *java-env
      BOOKING_SERVICE_URL: http://booking-service:8083
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  ai-service:
    build: ./services/ai-service
    container_name: edumentor-ai-service
    environment:
      <<: *java-env
      MENTOR_SERVICE_URL: http://mentor-service:8082
      PG_HOST: pgvector
      PG_PORT: "5432"
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    depends_on:
      pgvector: {condition: service_healthy}
      service-registry: {condition: service_healthy}

  api-gateway:
    build: ./services/api-gateway
    container_name: edumentor-api-gateway
    environment:
      <<: *java-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_SERVICE_URI: lb://auth-service
      MENTOR_SERVICE_URI: lb://mentor-service
      BOOKING_SERVICE_URI: lb://booking-service
      PAYMENT_SERVICE_URI: lb://payment-service
      NOTIFICATION_SERVICE_URI: lb://notification-service
      AI_SERVICE_URI: lb://ai-service
      REVIEW_SERVICE_URI: lb://review-service
    ports:
      - "8080:8080"
    depends_on:
      service-registry: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  mysql-data:
  pgvector-data: