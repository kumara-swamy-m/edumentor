spring.application.name=booking-service
server.port=${SERVER_PORT:8083}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (same secret as auth-service; no default on purpose)
app.jwt.secret=${JWT_SECRET}

# Synchronous calls to mentor-service
app.clients.mentor-service.url=${MENTOR_SERVICE_URL:http://localhost:8082}

# Booking rules
app.booking.hold-duration=${HOLD_DURATION:PT10M}
app.booking.max-pending-per-student=${MAX_PENDING_PER_STUDENT:3}
app.booking.min-slot-lead-time=${MIN_SLOT_LEAD_TIME:PT30M}
app.booking.expiry-batch-size=100
app.booking.expiry-scan-interval-ms=${EXPIRY_SCAN_INTERVAL_MS:30000}
app.booking.expiry-scheduler.enabled=${EXPIRY_SCHEDULER_ENABLED:true}

# Service discovery
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# Feign + Resilience4j
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# 4xx answers are business outcomes, not failures of the remote service
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$NotFound,feign.FeignException$Forbidden,feign.FeignException$Unauthorized
resilience4j.timelimiter.configs.default.timeout-duration=4s

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
app.kafka.enabled=${KAFKA_ENABLED:true}
app.outbox.relay-interval-ms=1000

# Meetings: mock | google
app.meeting.provider=${MEETING_PROVIDER:mock}
app.meeting.google.client-id=${GOOGLE_CLIENT_ID:}
app.meeting.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.meeting.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# Session reminders
app.booking.reminder-lead=${REMINDER_LEAD:PT1H}
app.booking.reminder-scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:true}
app.booking.reminder-scan-interval-ms=${REMINDER_SCAN_INTERVAL_MS:60000}

# Retry around service-to-service calls (outside the circuit breaker)
app.resilience.retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
app.resilience.retry.wait=${RETRY_WAIT:PT0.3S}