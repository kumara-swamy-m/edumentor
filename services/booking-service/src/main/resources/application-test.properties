spring.datasource.url=jdbc:h2:mem:edumentor_booking;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
app.clients.mentor-service.url=http://localhost:1
app.booking.expiry-scheduler.enabled=false
eureka.client.enabled=false

app.kafka.enabled=false
app.meeting.provider=mock
app.booking.reminder-scheduler.enabled=false
app.resilience.retry.wait=PT0.01S