spring.application.name=service-registry
server.port=${SERVER_PORT:8761}

# The registry does not register with itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}

# Self-preservation off in dev so dead instances disappear quickly
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true