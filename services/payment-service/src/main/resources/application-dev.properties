spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/edumentor_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.payment.mock.webhook-secret=${MOCK_WEBHOOK_SECRET:dev-only-mock-webhook-secret}