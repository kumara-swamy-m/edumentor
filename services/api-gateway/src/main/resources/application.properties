spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT (same secret as auth-service; no default on purpose)
app.jwt.secret=${JWT_SECRET}

# CORS (comma-separated list of allowed frontend origins)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-ID
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=X-Correlation-ID
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Service discovery
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# Upstream timeouts
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=15s

# Routes. Defaults are direct URLs for running without Eureka;
# set e.g. AUTH_SERVICE_URI=lb://auth-service when Eureka is enabled.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=mentor-service
spring.cloud.gateway.routes[1].uri=${MENTOR_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/mentors/**

spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=${BOOKING_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=${PAYMENT_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[5].id=ai-service
spring.cloud.gateway.routes[5].uri=${AI_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ai/**

spring.cloud.gateway.routes[6].id=review-service
spring.cloud.gateway.routes[6].uri=${REVIEW_SERVICE_URI:http://localhost:8087}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reviews/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true