app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
app.clients.mentor-service.url=http://localhost:1
app.ai.provider=mock
app.ai.vector-store=memory
app.ai.recommendations-per-minute=1000
eureka.client.enabled=false

# No database in the context tests: the in-memory vector store is used
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration