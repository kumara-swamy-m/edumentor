spring.application.name=ai-service
server.port=${SERVER_PORT:8086}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (same secret as auth-service; no default on purpose)
app.jwt.secret=${JWT_SECRET}

# Mentor data comes from mentor-service
app.clients.mentor-service.url=${MENTOR_SERVICE_URL:http://localhost:8082}

# AI: mock by default; the "openai" profile switches to Spring AI + OpenAI
app.ai.provider=mock
app.ai.dimensions=512
app.ai.vector-store=pgvector
app.ai.recommendations-per-minute=${AI_RATE_PER_MINUTE:10}

# Spring AI model auto-configuration is off unless the openai profile turns it on
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}

# Service discovery
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html