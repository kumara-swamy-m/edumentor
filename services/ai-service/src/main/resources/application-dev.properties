# stringtype=unspecified lets "?::vector" and "?::jsonb" casts work with plain string parameters
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5433}/${PG_DATABASE:edumentor_ai}?stringtype=unspecified
spring.datasource.username=${PG_USERNAME:postgres}
spring.datasource.password=${PG_PASSWORD}