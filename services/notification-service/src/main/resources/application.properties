spring.application.name=notification-service
server.port=${SERVER_PORT:8085}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (same secret as auth-service; no default on purpose)
app.jwt.secret=${JWT_SECRET}

# User lookup (emails) from auth-service, authenticated with a shared key. No default outside dev.
app.clients.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
app.internal.api-key=${INTERNAL_API_KEY:}

# Email: mock logs the message instead of sending it
app.email.provider=${EMAIL_PROVIDER:mock}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.enabled=${KAFKA_ENABLED:true}

# Service discovery
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html