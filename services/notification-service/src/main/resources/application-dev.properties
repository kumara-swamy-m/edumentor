spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/edumentor_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.internal.api-key=${INTERNAL_API_KEY:dev-only-internal-api-key}