spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (no default for the secret on purpose)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Optional bootstrap admin
app.admin.seed.email=${ADMIN_EMAIL:}
app.admin.seed.password=${ADMIN_PASSWORD:}

# Service discovery (enabled in Docker once Eureka exists)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging with correlation id
logging.pattern.level=%5p [%X{correlationId:-}]

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html