services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: edumentor-pgvector
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: edumentor_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD first}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edumentor_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector-data: